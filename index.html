<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Histogramme Grist avec étiquettes</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: sans-serif;
      box-sizing: border-box;
      background: #ffffff;
    }
    .chart-container {
      position: relative;
      width: 100%;
      height: 90vh;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <canvas id="monGraphique"></canvas>
  </div>

  <script>
    Chart.register(ChartDataLabels);

    let monGraphique = null;

    grist.ready({
      columns: [
        { name: "Categorie", title: "Colonne des catégories", optional: false },
        { name: "Valeur", title: "Colonne des valeurs (ou count)", optional: false }
      ],
      requiredAccess: 'read table'
    });

    grist.onRecords(function(records, mappings) {
      if (!records || records.length === 0) return;

      // Clés réelles mappées par Grist
      const catKey = (mappings && mappings.Categorie) ? mappings.Categorie : 'Categorie';
      const valKey = (mappings && mappings.Valeur) ? mappings.Valeur : 'Valeur';

      const labels = records.map(r => {
        // Recherche prioritaire : clé mappée, ou clé directe 'Categorie', ou première colonne qui n'est ni 'id' ni 'count'
        let val = r[catKey] !== undefined ? r[catKey] : r.Categorie;

        if (val === undefined || val === null || val === '') {
          // Secours : on cherche la première valeur non numérique du record
          for (let k of Object.keys(r)) {
            if (k !== 'id' && k !== 'count' && k !== valKey && k !== 'group' && typeof r[k] === 'string') {
              val = r[k];
              break;
            }
          }
        }

        if (val === null || val === undefined || val === '') return "Sans libellé";
        if (typeof val === 'object') {
          return Array.isArray(val) ? val.join(', ') : (val.label || JSON.stringify(val));
        }
        return String(val);
      });

      const dataValues = records.map(r => {
        let num = r[valKey] !== undefined ? r[valKey] : (r.Valeur !== undefined ? r.Valeur : r.count);
        return Number(num) || 0;
      });

      const ctx = document.getElementById('monGraphique').getContext('2d');

      if (monGraphique) {
        monGraphique.destroy();
      }

      monGraphique = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: '#000091',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            datalabels: {
              anchor: 'end',
              align: 'top',
              color: '#161616',
              font: { weight: 'bold', size: 12 },
              formatter: function(value) {
                return value > 0 ? value : '';
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grace: '15%',
              ticks: { precision: 0 }
            },
            x: {
              grid: { display: false }
            }
          }
        }
      });
    });
  </script>
</body>
</html>
