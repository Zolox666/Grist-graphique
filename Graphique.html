<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Widget Graphiques Multiples Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1e1e1e;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      height: 28px;
    }

    .btn-action {
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #d1d5db;
      background: #f8fafc;
      color: #334155;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .btn-save {
      background: #000091;
      color: #ffffff;
      border-color: #000091;
      font-weight: 600;
      margin-left: auto;
    }
    .btn-save:hover {
      background: #1212ff;
      border-color: #1212ff;
    }

    .sub-panel {
      display: none;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      z-index: 10;
    }
    .sub-panel.open {
      display: block;
    }

    .panel-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: #475569;
      font-weight: 500;
    }

    select {
      font-size: 11.5px;
      padding: 4px 7px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background-color: #ffffff;
      color: #0f172a;
      cursor: pointer;
      outline: none;
    }
    select:focus {
      border-color: #000091;
    }

    #customOrderContainer {
      display: none;
      border-top: 1px dashed #cbd5e1;
      padding-top: 8px;
      margin-top: 8px;
      max-height: 150px;
      overflow-y: auto;
      flex-direction: column;
      gap: 4px;
    }
    #customOrderContainer.show {
      display: flex;
    }
    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      font-size: 11.5px;
    }
    .order-btns {
      display: flex;
      gap: 4px;
    }
    .btn-move {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-move:hover {
      background: #e2e8f0;
    }

    #customColorsContainer {
      display: none;
      border-top: 1px dashed #cbd5e1;
      padding-top: 8px;
      margin-top: 8px;
      max-height: 120px;
      overflow-y: auto;
    }
    #customColorsContainer.show {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .color-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      font-size: 11px;
    }
    .color-item input[type="color"] {
      width: 20px;
      height: 20px;
      border: none;
      padding: 0;
      cursor: pointer;
      background: none;
      border-radius: 3px;
    }

    .chart-container {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    .toast {
      position: fixed;
      bottom: 8px;
      right: 8px;
      background: #000091;
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 50;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button type="button" id="btnToggleFormat" class="btn-action">📊 Format</button>
    <button type="button" id="btnToggleCouleurs" class="btn-action">🎨 Couleurs</button>
  </div>

  <!-- Volet Format -->
  <div id="panelFormat" class="sub-panel">
    <div class="panel-row">
      <div class="control-group">
        <label for="chartType">Graphique :</label>
        <select id="chartType">
          <option value="bar">Barres verticales</option>
          <option value="horizontalBar">Barres horizontales</option>
          <option value="pie">Camembert</option>
          <option value="doughnut">Donut</option>
          <option value="line">Courbe</option>
        </select>
      </div>

      <div class="control-group">
        <label for="sortOrder">Ordre :</label>
        <select id="sortOrder">
          <option value="default">Ordre de la table</option>
          <option value="satisfaction_desc">Satisfaction (Positif ➔ Négatif)</option>
          <option value="satisfaction_asc">Satisfaction (Négatif ➔ Positif)</option>
          <option value="value_desc">Valeur décroissante</option>
          <option value="value_asc">Valeur croissante</option>
          <option value="custom">Ordre personnalisé (↑ ↓)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="labelFormat">Étiquettes :</label>
        <select id="labelFormat">
          <option value="count">Nombre</option>
          <option value="percent">Pourcentage (%)</option>
          <option value="both">Nombre + %</option>
          <option value="none">Masquer</option>
        </select>
      </div>

      <div class="control-group">
        <label for="fontSizeSelect">Police :</label>
        <select id="fontSizeSelect">
          <option value="9">Très petite (9px)</option>
          <option value="10">Petite (10px)</option>
          <option value="11" selected>Normale (11px)</option>
          <option value="12">Moyenne (12px)</option>
          <option value="13">Grande (13px)</option>
        </select>
      </div>

      <button type="button" id="btnSaveFormat" class="btn-action btn-save">💾 Enregistrer et fermer</button>
    </div>

    <div id="customOrderContainer"></div>
  </div>

  <!-- Volet Couleurs -->
  <div id="panelCouleurs" class="sub-panel">
    <div class="panel-row">
      <div class="control-group">
        <label for="colorPalette">Palette :</label>
        <select id="colorPalette">
          <option value="custom">Personnalisée (barre par barre)</option>
          <option value="red_to_green">Dégradé Rouge ➔ Vert (Performance)</option>
          <option value="green_to_red">Dégradé Vert ➔ Rouge</option>
          <option value="threshold_rg">Seuil Performance (Rouge / Vert)</option>
          <option value="marianne">Bleu Institutionnel</option>
          <option value="vibrant">Moderne (Multicolore)</option>
          <option value="blues">Dégradé Bleu</option>
          <option value="greens">Dégradé Vert</option>
          <option value="warm">Tons Chauds</option>
          <option value="pastel">Pastel</option>
        </select>
      </div>
      <button type="button" id="btnSaveCouleurs" class="btn-action btn-save">💾 Enregistrer et fermer</button>
    </div>
    <div id="customColorsContainer"></div>
  </div>

  <div class="chart-container">
    <canvas id="monGraphique"></canvas>
  </div>
  <div id="toast" class="toast">Préférences enregistrées ✓</div>

  <script>
    Chart.register(ChartDataLabels);

    let monGraphique = null;
    let donneesActuelles = [];
    let mappingsActuels = {};
    let customColorMap = {};
    let customOrderList = [];
    let optionsLoaded = false;

    const PALETTES = {
      marianne: ['#000091', '#1212ff', '#417dc4', '#7994c2', '#a3b7d8', '#274975', '#5770be'],
      vibrant: ['#000091', '#e1000f', '#008941', '#f59f00', '#6f42c1', '#17a2b8', '#e83e8c', '#fd7e14'],
      blues: ['#002b66', '#0047ab', '#0066cc', '#3385ff', '#66a3ff', '#99c2ff', '#cce0ff'],
      greens: ['#0e4429', '#006644', '#00875a', '#36b37e', '#57d9a3', '#79f2c0', '#abf5d1'],
      warm: ['#8a1c14', '#c93b2b', '#e65100', '#f57c00', '#ff9800', '#ffb74d', '#ffe082'],
      pastel: ['#93c5fd', '#86efac', '#fde047', '#fca5a5', '#d8b4fe', '#fdba74', '#a5f3fc']
    };

    grist.ready({
      columns: [
        { name: "Categorie", title: "Colonne des catégories", optional: false },
        { name: "Valeur", title: "Colonne des valeurs (ou count)", optional: false }
      ],
      requiredAccess: 'full'
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    grist.onRecords(function(records, mappings) {
      donneesActuelles = records || [];
      mappingsActuels = mappings || {};
      if (optionsLoaded) {
        mettreAJourListeOrdre();
      }
      mettreAJourSelecteurCouleurs();
      rendreGraphique();
    });

    grist.onOptions(function(options) {
      optionsLoaded = true;
      if (options) {
        if (options.chartType) document.getElementById('chartType').value = options.chartType;
        if (options.sortOrder) document.getElementById('sortOrder').value = options.sortOrder;
        if (options.labelFormat) document.getElementById('labelFormat').value = options.labelFormat;
        if (options.fontSize) document.getElementById('fontSizeSelect').value = options.fontSize;
        if (options.colorPalette) document.getElementById('colorPalette').value = options.colorPalette;
        if (options.customColorMap) customColorMap = { ...options.customColorMap };
        if (Array.isArray(options.customOrderList)) {
          customOrderList = options.customOrderList.map(s => String(s).trim());
        }
      }
      mettreAJourListeOrdre();
      mettreAJourSelecteurCouleurs();
      rendreGraphique();
    });

    // Enregistrement atomique en une seule opération (évite les conflits de sauvegarde)
    async function sauvegarderPreferences() {
      const payload = {
        chartType: document.getElementById('chartType').value,
        sortOrder: document.getElementById('sortOrder').value,
        labelFormat: document.getElementById('labelFormat').value,
        fontSize: document.getElementById('fontSizeSelect').value,
        colorPalette: document.getElementById('colorPalette').value,
        customColorMap: customColorMap,
        customOrderList: customOrderList
      };
      try {
        await grist.setOptions(payload);
        showToast("Préférences enregistrées ✓");
      } catch (e) {
        console.error("Erreur setOptions :", e);
        showToast("Erreur sauvegarde (vérifiez l'accès complet)");
      }
    }

    const panelFormat = document.getElementById('panelFormat');
    const panelCouleurs = document.getElementById('panelCouleurs');

    document.getElementById('btnToggleFormat').addEventListener('click', () => {
      panelCouleurs.classList.remove('open');
      panelFormat.classList.toggle('open');
    });

    document.getElementById('btnToggleCouleurs').addEventListener('click', () => {
      panelFormat.classList.remove('open');
      panelCouleurs.classList.toggle('open');
    });

    document.getElementById('btnSaveFormat').addEventListener('click', async () => {
      await sauvegarderPreferences();
      panelFormat.classList.remove('open');
    });

    document.getElementById('btnSaveCouleurs').addEventListener('click', async () => {
      await sauvegarderPreferences();
      panelCouleurs.classList.remove('open');
    });

    document.getElementById('chartType').addEventListener('change', rendreGraphique);
    document.getElementById('labelFormat').addEventListener('change', rendreGraphique);
    document.getElementById('fontSizeSelect').addEventListener('change', rendreGraphique);

    document.getElementById('sortOrder').addEventListener('change', () => {
      mettreAJourListeOrdre();
      mettreAJourSelecteurCouleurs();
      rendreGraphique();
    });

    document.getElementById('colorPalette').addEventListener('change', (e) => {
      const container = document.getElementById('customColorsContainer');
      if (e.target.value === 'custom') {
        container.classList.add('show');
      } else {
        container.classList.remove('show');
      }
      rendreGraphique();
    });

    function decouperTexteMultiligne(texte, maxChars) {
      const str = String(texte);
      if (str.length <= maxChars) return str;

      const mots = str.split(' ');
      const lignes = [];
      let ligneCourante = '';

      mots.forEach(mot => {
        if ((ligneCourante + ' ' + mot).trim().length <= maxChars) {
          ligneCourante = (ligneCourante + ' ' + mot).trim();
        } else {
          if (ligneCourante) lignes.push(ligneCourante);
          ligneCourante = mot;
        }
      });
      if (ligneCourante) lignes.push(ligneCourante);
      return lignes;
    }

    function getSatisfactionRank(label, inverse = false) {
      const norm = String(label)
        .toLowerCase()
        .replace(/['’`]/g, "'")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      let rank = 50;

      if (norm.includes("tout a fait") || norm.includes("tres satisfait") || norm.includes("toujours")) {
        rank = 1;
      } else if (norm.includes("plutot satisfait") || norm.includes("plutot d'accord") || norm.includes("souvent")) {
        rank = 2;
      } else if (norm.includes("moyennement") || norm.includes("neutre")) {
        rank = 3;
      } else if (norm.includes("plutot pas") || norm.includes("peu satisfait") || norm.includes("rarement")) {
        rank = 4;
      } else if (norm.includes("pas du tout") || norm.includes("jamais")) {
        rank = 5;
      } else if (norm.includes("n'ai pas") || norm.includes("non concerne") || norm.includes("sans objet") || norm.includes("aucun")) {
        rank = 90;
      }

      if (inverse && rank < 50) {
        return 10 - rank;
      }
      return rank;
    }

    function extraireLabelsEtValeurs() {
      const catKey = (mappingsActuels && mappingsActuels.Categorie) ? mappingsActuels.Categorie : 'Categorie';
      const valKey = (mappingsActuels && mappingsActuels.Valeur) ? mappingsActuels.Valeur : 'Valeur';

      let items = donneesActuelles.map((r, originalIdx) => {
        let val = r[catKey] !== undefined ? r[catKey] : r.Categorie;
        if (val === undefined || val === null || val === '') {
          for (let k of Object.keys(r)) {
            if (k !== 'id' && k !== 'count' && k !== valKey && k !== 'group' && typeof r[k] === 'string') {
              val = r[k];
              break;
            }
          }
        }
        let label = "Sans libellé";
        if (val !== null && val !== undefined && val !== '') {
          label = (typeof val === 'object')
            ? (Array.isArray(val) ? val.join(', ') : (val.label || JSON.stringify(val)))
            : String(val);
        }
        label = label.trim();

        let num = r[valKey] !== undefined ? r[valKey] : (r.Valeur !== undefined ? r.Valeur : r.count);
        let value = Number(num) || 0;

        return { label, value, originalIdx };
      });

      const sortMode = document.getElementById('sortOrder').value;

      if (sortMode === 'satisfaction_desc') {
        items.sort((a, b) => getSatisfactionRank(a.label, false) - getSatisfactionRank(b.label, false));
      } else if (sortMode === 'satisfaction_asc') {
        items.sort((a, b) => getSatisfactionRank(a.label, true) - getSatisfactionRank(b.label, true));
      } else if (sortMode === 'value_desc') {
        items.sort((a, b) => b.value - a.value);
      } else if (sortMode === 'value_asc') {
        items.sort((a, b) => a.value - b.value);
      } else if (sortMode === 'custom' && customOrderList.length > 0) {
        items.sort((a, b) => {
          const idxA = customOrderList.indexOf(a.label);
          const idxB = customOrderList.indexOf(b.label);
          const posA = idxA === -1 ? 999 : idxA;
          const posB = idxB === -1 ? 999 : idxB;
          return posA - posB;
        });
      }

      return {
        labels: items.map(i => i.label),
        values: items.map(i => i.value)
      };
    }

    function mettreAJourListeOrdre() {
      const container = document.getElementById('customOrderContainer');
      const sortMode = document.getElementById('sortOrder').value;
      container.innerHTML = '';

      if (sortMode !== 'custom') {
        container.classList.remove('show');
        return;
      }

      container.classList.add('show');
      const { labels } = extraireLabelsEtValeurs();

      if (customOrderList.length === 0) {
        customOrderList = [...labels];
      } else {
        labels.forEach(lbl => {
          if (!customOrderList.includes(lbl)) {
            customOrderList.push(lbl);
          }
        });
        customOrderList = customOrderList.filter(lbl => labels.includes(lbl));
      }

      customOrderList.forEach((lbl, idx) => {
        const row = document.createElement('div');
        row.className = 'order-item';

        const textSpan = document.createElement('span');
        textSpan.textContent = `${idx + 1}. ${lbl}`;

        const btnsDiv = document.createElement('div');
        btnsDiv.className = 'order-btns';

        const btnUp = document.createElement('button');
        btnUp.type = 'button';
        btnUp.className = 'btn-move';
        btnUp.textContent = '↑';
        btnUp.disabled = (idx === 0);
        btnUp.addEventListener('click', () => {
          if (idx > 0) {
            [customOrderList[idx - 1], customOrderList[idx]] = [customOrderList[idx], customOrderList[idx - 1]];
            mettreAJourListeOrdre();
            mettreAJourSelecteurCouleurs();
            rendreGraphique();
          }
        });

        const btnDown = document.createElement('button');
        btnDown.type = 'button';
        btnDown.className = 'btn-move';
        btnDown.textContent = '↓';
        btnDown.disabled = (idx === customOrderList.length - 1);
        btnDown.addEventListener('click', () => {
          if (idx < customOrderList.length - 1) {
            [customOrderList[idx + 1], customOrderList[idx]] = [customOrderList[idx], customOrderList[idx + 1]];
            mettreAJourListeOrdre();
            mettreAJourSelecteurCouleurs();
            rendreGraphique();
          }
        });

        btnsDiv.appendChild(btnUp);
        btnsDiv.appendChild(btnDown);
        row.appendChild(textSpan);
        row.appendChild(btnsDiv);
        container.appendChild(row);
      });
    }

    function interpolateColor(color1, color2, factor) {
      const c1 = parseInt(color1.slice(1), 16);
      const c2 = parseInt(color2.slice(1), 16);
      const r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
      const r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;
      const r = Math.round(r1 + factor * (r2 - r1));
      const g = Math.round(g1 + factor * (g2 - g1));
      const b = Math.round(b1 + factor * (b2 - b1));
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function mettreAJourSelecteurCouleurs() {
      const { labels } = extraireLabelsEtValeurs();
      const container = document.getElementById('customColorsContainer');
      container.innerHTML = '';

      if (document.getElementById('colorPalette').value === 'custom') {
        container.classList.add('show');
      } else {
        container.classList.remove('show');
      }

      labels.forEach((lbl, index) => {
        const item = document.createElement('div');
        item.className = 'color-item';

        const colorInput = document.createElement('input');
        colorInput.type = 'color';
        colorInput.value = customColorMap[lbl] || (PALETTES.vibrant[index % PALETTES.vibrant.length]);

        colorInput.addEventListener('change', (e) => {
          customColorMap[lbl] = e.target.value;
          rendreGraphique();
        });

        const span = document.createElement('span');
        span.textContent = lbl;

        item.appendChild(colorInput);
        item.appendChild(span);
        container.appendChild(item);
      });
    }

    function calculerCouleurs(labels, values, paletteName) {
      const count = labels.length;
      const minVal = Math.min(...values);
      const maxVal = Math.max(...values);
      const range = (maxVal - minVal) === 0 ? 1 : (maxVal - minVal);
      const avgVal = values.reduce((a, b) => a + b, 0) / (count || 1);

      if (paletteName === 'custom') {
        return labels.map((lbl, idx) => customColorMap[lbl] || PALETTES.vibrant[idx % PALETTES.vibrant.length]);
      }
      if (paletteName === 'threshold_rg') {
        return values.map(v => v >= avgVal ? '#008941' : '#e1000f');
      }
      if (paletteName === 'red_to_green') {
        return values.map(v => {
          const factor = (v - minVal) / range;
          return interpolateColor('#e1000f', '#008941', factor);
        });
      }
      if (paletteName === 'green_to_red') {
        return values.map(v => {
          const factor = (v - minVal) / range;
          return interpolateColor('#008941', '#e1000f', factor);
        });
      }

      const base = PALETTES[paletteName] || PALETTES.marianne;
      return labels.map((_, i) => base[i % base.length]);
    }

    function rendreGraphique() {
      if (!donneesActuelles || donneesActuelles.length === 0) return;

      const { labels, values } = extraireLabelsEtValeurs();
      const total = values.reduce((acc, v) => acc + v, 0);

      const selectedType = document.getElementById('chartType').value;
      const selectedPalette = document.getElementById('colorPalette').value;
      const labelFormat = document.getElementById('labelFormat').value;
      const fontSize = parseInt(document.getElementById('fontSizeSelect').value, 10) || 11;
      const colors = calculerCouleurs(labels, values, selectedPalette);

      const isCircular = (selectedType === 'pie' || selectedType === 'doughnut');
      const isHorizontal = (selectedType === 'horizontalBar');
      const isLine = (selectedType === 'line');
      const chartType = isHorizontal ? 'bar' : selectedType;

      const maxCharsPerLine = isHorizontal ? 24 : 16;
      const displayLabels = isCircular
        ? labels
        : labels.map(lbl => decouperTexteMultiligne(lbl, maxCharsPerLine));

      const dataset = {
        data: values,
        backgroundColor: colors,
        borderColor: isLine ? colors[0] : (isCircular ? '#ffffff' : undefined),
        borderWidth: isCircular ? 2 : (isLine ? 3 : 0),
        borderRadius: (chartType === 'bar' && !isCircular) ? 4 : 0,
        fill: isLine ? false : undefined,
        tension: isLine ? 0.2 : undefined
      };

      const ctx = document.getElementById('monGraphique').getContext('2d');
      if (monGraphique) monGraphique.destroy();

      monGraphique = new Chart(ctx, {
        type: chartType,
        data: {
          labels: displayLabels,
          datasets: [dataset]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: isHorizontal ? 'y' : 'x',
          plugins: {
            legend: {
              display: isCircular,
              position: 'bottom',
              labels: { boxWidth: 12, font: { size: fontSize } }
            },
            tooltip: {
              callbacks: {
                title: function(context) {
                  const idx = context[0].dataIndex;
                  return labels[idx];
                }
              }
            },
            datalabels: {
              display: labelFormat !== 'none',
              anchor: isCircular ? 'center' : 'end',
              align: isCircular ? 'center' : (isHorizontal ? 'right' : 'top'),
              color: isCircular ? '#ffffff' : '#1e1e1e',
              font: { weight: 'bold', size: fontSize },
              formatter: function(value) {
                if (value <= 0 || labelFormat === 'none') return '';
                const pct = total > 0 ? ((value / total) * 100).toFixed(1).replace('.', ',') + ' %' : '0 %';
                if (labelFormat === 'percent') return pct;
                if (labelFormat === 'both') return `${value} (${pct})`;
                return value;
              }
            }
          },
          scales: isCircular ? {} : {
            x: {
              grid: { display: isHorizontal },
              grace: isHorizontal ? '15%' : 0,
              ticks: {
                precision: 0,
                maxRotation: 0,
                minRotation: 0,
                autoSkip: false,
                font: { size: fontSize }
              }
            },
            y: {
              beginAtZero: true,
              grace: isHorizontal ? 0 : '15%',
              grid: { display: !isHorizontal },
              ticks: {
                precision: 0,
                autoSkip: false,
                font: { size: fontSize }
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
